version: "3.8"

# Convenience file to spin up a local PostgreSQL instance for development.
# Run: docker compose up -d
# Then set DATABASE_URL in backend/.env to:
# postgresql://lessgo:lessgo@localhost:5432/lessgo?schema=public

services:
  postgres:
    image: postgres:16-alpine
    container_name: lessgo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lessgo
      POSTGRES_PASSWORD: lessgo
      POSTGRES_DB: lessgo
    ports:
      - "5432:5432"
    volumes:
      - lessgo_pgdata:/var/lib/postgresql/data

volumes:
  lessgo_pgdata:
